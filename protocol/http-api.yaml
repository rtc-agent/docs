openapi: 3.1.0
info:
  title: RTC Agent HTTP API
  description: |
    RTC Agent HTTP 协议定义。

    本文件**仅描述 HTTP 接口**，WebSocket 协议（Centrifuge RPC / 实时频道）见 WebSocket 协议文档。

    ## 服务架构

    | 服务 | 端口 | 说明 |
    |------|------|------|
    | Main Server | 8080 | 用户 API：OAuth2、STS、Interrupt、Memory、S3 兼容存储 |
    | Admin Server | 8081 | 管理后台：用户管理、角色权限、审计日志 |

    ## 认证方式

    - **Main Server**：JWT Bearer Token（通过 `/oauth2/token` 获取）
    - **Admin Server**：Admin JWT Bearer Token（通过 `/api/auth/login` 获取）
    - **公开端点**：健康检查、OAuth2 授权/令牌交换、JWKS
  version: 1.0.0

tags:
  - name: Health
    description: 健康检查与就绪检测
  - name: OAuth2
    description: 用户认证与令牌管理
  - name: Interrupt
    description: 中断答案提交（AI 等待人工确认时）
  - name: Memory
    description: 记忆导出
  - name: STS
    description: 临时凭证与预签名 URL
  - name: Admin Auth
    description: 管理员认证
  - name: Admin Roles
    description: 角色管理
  - name: Admin Permissions
    description: 权限策略管理
  - name: Admin User Roles
    description: 用户角色关联管理
  - name: Admin Users
    description: 管理员用户管理
  - name: Admin Audit Logs
    description: 审计日志查询

# ============================================================
# Paths
# ============================================================

paths:
  # ----------------------------------------------------------
  # Main Server: Health
  # ----------------------------------------------------------

  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: 健康检查
      description: 返回服务健康状态，用于 Kubernetes liveness probe。
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      operationId: readyz
      tags: [Health]
      summary: 就绪检查
      description: 返回服务就绪状态，用于 Kubernetes readiness probe。
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      operationId: metrics
      tags: [Health]
      summary: Prometheus 指标
      description: |
        返回 Prometheus 格式的性能指标。
        - **开发环境**：无需认证
        - **生产环境**：需 Basic Auth（配置 metrics.user / metrics.password）
      security:
        - basicAuth: []
        - {}
      responses:
        "200":
          description: Prometheus 指标数据
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus exposition format

  # ----------------------------------------------------------
  # Main Server: OAuth2
  # ----------------------------------------------------------

  /oauth2/providers:
    get:
      operationId: listOAuth2Providers
      tags: [OAuth2]
      summary: 获取已启用的 OAuth2 Provider 列表
      description: 返回当前服务端配置中已启用的 OAuth2 Provider 名称列表。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2ProvidersResponse'

  /oauth2/authorize:
    get:
      operationId: getOAuth2RedirectUrl
      tags: [OAuth2]
      summary: 获取 OAuth2 重定向 URL
      description: 前端调用此接口获取 OAuth2 Provider 授权页面的重定向地址。
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
          description: OAuth2 Provider 名称（如 "github", "google", "mock"）
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: 客户端回调地址（Provider 授权完成后重定向到此地址）
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
          description: PKCE code_challenge (RFC 7636)，由 code_verifier 经 SHA-256 + base64url 编码得到
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256, plain]
            default: S256
          description: PKCE challenge 方法，推荐 S256
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2AuthorizeResponse'
        "400":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'

  /oauth2/token:
    post:
      operationId: oauth2TokenExchange
      tags: [OAuth2]
      summary: OAuth2 令牌交换
      description: |
        支持两种模式，通过 `grant_type` 区分：
        1. **Authorization Code**（默认）：使用授权码换取 access_token + refresh_token
        2. **Token Exchange**（RFC 8693）：将外部 JWT（如 admin-server JWT）换取主服务器 access_token

        支持 `application/json` 和 `application/x-www-form-urlencoded` 两种 Content-Type。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OAuth2TokenExchangeRequest'
                - $ref: '#/components/schemas/OAuth2TokenExchangeRFC8693Request'
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: '#/components/schemas/OAuth2TokenExchangeRequest'
                  urn:ietf:params:oauth:grant-type:token-exchange: '#/components/schemas/OAuth2TokenExchangeRFC8693Request'
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OAuth2TokenExchangeRequest'
                - $ref: '#/components/schemas/OAuth2TokenExchangeRFC8693Request'
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OAuth2TokenExchangeResponse'
                  - $ref: '#/components/schemas/OAuth2TokenExchangeRFC8693Response'
        "400":
          description: 请求参数无效或授权码无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'

  /oauth2/refresh:
    post:
      operationId: oauth2TokenRefresh
      tags: [OAuth2]
      summary: OAuth2 令牌刷新
      description: 使用 refresh_token 换取新的 access_token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2TokenRefreshRequest'
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2TokenRefreshResponse'
        "400":
          description: refresh_token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'

  # ----------------------------------------------------------
  # Main Server: Interrupt
  # ----------------------------------------------------------

  /api/sessions/{sessionID}/interrupts/{interruptID}/answer:
    post:
      operationId: submitInterruptAnswer
      tags: [Interrupt]
      summary: 提交中断答案
      description: |
        前端通过此接口提交中断答案（AI 请求人工确认时）。
        后端通过 Redis SET+PUBLISH 将答案送达等待中的中断处理协程。

        **安全要求**：JWT 认证，且验证 session 归属。
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 会话 ID
        - name: interruptID
          in: path
          required: true
          schema:
            type: string
          description: 中断 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterruptAnswerRequest'
      responses:
        "202":
          description: 答案已接受，正在投递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptAnswerResponse'
        "400":
          description: 请求参数无效（session_id/interrupt_id 格式错误，或 answer 为空/超长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 无权操作此 session（session 不属于当前用户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: session 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------------
  # Main Server: Memory
  # ----------------------------------------------------------

  /api/memories/export:
    post:
      operationId: exportMemories
      tags: [Memory]
      summary: 导出记忆
      description: |
        导出指定范围、格式的记忆数据。
        支持 session/user/global 三种 scope，输出 OKF (Open Knowledge Format) gzip 压缩包。

        **安全要求**：JWT 认证。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMemoriesRequest'
      responses:
        "200":
          description: 导出成功（流式返回 gzip 压缩包）
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "501":
          description: 记忆系统未配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [memory.not_configured]

  # ----------------------------------------------------------
  # Main Server: STS
  # ----------------------------------------------------------

  /api/credentials/temporary:
    post:
      operationId: issueTemporaryCredentials
      tags: [STS]
      summary: 签发临时 S3 凭证
      description: |
        为当前用户签发临时 S3 凭证（AccessKeyId / SecretAccessKey / SessionToken），
        用于直接访问对象存储。凭证有效期由服务端配置决定。

        **安全要求**：JWT 认证。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 签发成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryCredentialsResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/presigned-url:
    post:
      operationId: generatePresignedURL
      tags: [STS]
      summary: 生成预签名 URL
      description: |
        生成 S3 预签名 URL，用于前端直传/下载文件。
        支持 put（上传）和 get（下载）两种操作。

        **安全要求**：JWT 认证。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedURLRequest'
      responses:
        "200":
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedURLResponse'
        "400":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================
  # Admin Server API（独立服务，端口 8081）
  # ==========================================================

  # ----------------------------------------------------------
  # Admin Auth
  # ----------------------------------------------------------

  /api/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin Auth]
      summary: 管理员登录
      description: |
        管理员使用邮箱和密码登录，获取 JWT 令牌。
        登录成功后，admin-server 签发的 JWT 可通过主服务器的 token_exchange 机制（RFC 8693）换取主服务器的 access_token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        "200":
          description: 登录成功或业务错误（HTTP 状态码始终为 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminLoginSuccessResponse'
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/auth/refresh:
    post:
      operationId: adminRefresh
      tags: [Admin Auth]
      summary: 管理员令牌刷新
      description: 使用 refresh_token 换取新的 access_token（Admin-server 端点）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshRequest'
      responses:
        "200":
          description: 刷新成功或业务错误（HTTP 状态码始终为 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminRefreshSuccessResponse'
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/auth/me:
    get:
      operationId: adminGetCurrentUser
      tags: [Admin Auth]
      summary: 获取当前管理员信息
      description: 返回当前 JWT 对应的管理员用户信息，包含角色列表。
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminGetCurrentUserSuccessResponse'
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin Auth]
      summary: 管理员登出
      description: 撤销 refresh_token，需要 JWT 认证。
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogoutRequest'
      responses:
        "200":
          description: 登出成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminLogoutSuccessResponse'
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /.well-known/jwks.json:
    get:
      operationId: adminJWKS
      tags: [Admin Auth]
      summary: Admin-server JWKS 端点
      description: |
        返回 admin-server 的 JSON Web Key Set，主服务器通过此端点获取公钥以验证 admin JWT 签名。
        这是 RFC 8693 Token Exchange 机制的核心端点。
      responses:
        "200":
          description: JWKS 公钥集合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  /health:
    get:
      operationId: adminHealth
      tags: [Admin Auth]
      summary: Admin 服务健康检查
      responses:
        "200":
          description: 健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthResponse'

  # ----------------------------------------------------------
  # Admin Roles
  # ----------------------------------------------------------

  /api/roles:
    get:
      operationId: adminListRoles
      tags: [Admin Roles]
      summary: 角色列表
      description: 分页查询角色列表。
      security:
        - adminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页数量
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListRolesResponse'

    post:
      operationId: adminCreateRole
      tags: [Admin Roles]
      summary: 创建角色
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateRoleRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        $ref: '#/components/schemas/RoleResponse'
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/roles/{id}:
    get:
      operationId: adminGetRole
      tags: [Admin Roles]
      summary: 获取角色详情
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        $ref: '#/components/schemas/RoleResponse'
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

    put:
      operationId: adminUpdateRole
      tags: [Admin Roles]
      summary: 更新角色（全量）
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRoleRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        $ref: '#/components/schemas/RoleResponse'
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

    patch:
      operationId: adminPatchRole
      tags: [Admin Roles]
      summary: 更新角色（部分）
      description: 与 PUT 共用 handler，支持部分字段更新。
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRoleRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        $ref: '#/components/schemas/RoleResponse'
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

    delete:
      operationId: adminDeleteRole
      tags: [Admin Roles]
      summary: 删除角色
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ok]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/roles/{id}/policies:
    get:
      operationId: adminGetRolePolicies
      tags: [Admin Roles]
      summary: 获取角色权限策略列表
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/PolicyItemResponse'
                        required: [items]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  # ----------------------------------------------------------
  # Admin Permissions
  # ----------------------------------------------------------

  /api/permissions:
    get:
      operationId: adminListPermissions
      tags: [Admin Permissions]
      summary: 权限策略列表
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListPermissionsResponse'

    post:
      operationId: adminCreatePermission
      tags: [Admin Permissions]
      summary: 创建权限策略
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreatePermissionRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ok]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

    delete:
      operationId: adminDeletePermission
      tags: [Admin Permissions]
      summary: 删除权限策略
      description: DELETE 请求体携带 JSON（非标准用法，遵循项目约定）。
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDeletePermissionRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ok]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/permissions/check:
    post:
      operationId: adminCheckPermission
      tags: [Admin Permissions]
      summary: 检查用户权限
      description: 检查指定用户是否有权限执行指定操作。
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCheckPermissionRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required: [allowed]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  # ----------------------------------------------------------
  # Admin User Roles
  # ----------------------------------------------------------

  /api/admin-users/{id}/roles:
    get:
      operationId: adminListUserRoles
      tags: [Admin User Roles]
      summary: 获取用户的角色列表
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 管理员用户 ID
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/UserRoleResponse'
                          total:
                            type: integer
                        required: [items, total]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

    post:
      operationId: adminAssignRoles
      tags: [Admin User Roles]
      summary: 批量分配角色给用户
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignRolesRequest'
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ok]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/admin-users/{id}/roles/{roleId}:
    delete:
      operationId: adminRemoveUserRole
      tags: [Admin User Roles]
      summary: 移除用户的角色
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 管理员用户 ID
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 ID
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [ok]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  /api/roles/{id}/admin-users:
    get:
      operationId: adminListRoleUsers
      tags: [Admin User Roles]
      summary: 获取拥有指定角色的用户列表
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 ID
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/UserRoleResponse'
                          total:
                            type: integer
                        required: [items, total]
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

  # ----------------------------------------------------------
  # Admin Users
  # ----------------------------------------------------------

  /api/admin-users:
    get:
      operationId: adminListUsers
      tags: [Admin Users]
      summary: 管理员用户列表
      security:
        - adminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListUsersResponse'

  # ----------------------------------------------------------
  # Admin Audit Logs
  # ----------------------------------------------------------

  /api/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [Admin Audit Logs]
      summary: 审计日志列表
      description: 支持多种过滤条件和分页查询。
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator_id
          in: query
          schema:
            type: string
            format: uuid
          description: 操作者 ID
        - name: resource_type
          in: query
          schema:
            type: string
          description: 资源类型（如 role, permission, user）
        - name: event_type
          in: query
          schema:
            type: string
          description: 事件类型（如 create, update, delete）
        - name: resource_id
          in: query
          schema:
            type: string
            format: uuid
          description: 资源 ID
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
          description: 开始时间
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
          description: 结束时间
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListAuditLogsResponse'

  /api/audit-logs/{id}:
    get:
      operationId: adminGetAuditLog
      tags: [Admin Audit Logs]
      summary: 获取审计日志详情
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 成功或业务错误
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        enum: [true]
                      data:
                        $ref: '#/components/schemas/AuditLogResponse'
                    required: [success, data]
                  - $ref: '#/components/schemas/AdminErrorResponse'

# ============================================================
# Components
# ============================================================

components:
  # ----------------------------------------------------------
  # Security Schemes
  # ----------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Main Server JWT（通过 /oauth2/token 获取）

    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin Server JWT（通过 /api/auth/login 获取）

    basicAuth:
      type: http
      scheme: basic
      description: Metrics 端点 Basic Auth（生产环境）

  # ----------------------------------------------------------
  # Schemas
  # ----------------------------------------------------------
  schemas:
    # ========== Health ==========

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        timestamp:
          type: string
          format: date-time
      required: [status]

    # ========== Main Server: OAuth2 ==========

    OAuth2ProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
          description: 已启用的 provider 名称列表（如 ["github", "google"]）
      required: [providers]

    OAuth2AuthorizeResponse:
      type: object
      description: OAuth2 授权重定向信息
      properties:
        redirect_url:
          type: string
          description: OAuth2 Provider 授权页面的完整 URL
        state:
          type: string
          description: CSRF 防护随机状态参数，回调时需原样传回
      required: [redirect_url, state]

    OAuth2Error:
      type: object
      description: OAuth2 通用错误响应
      properties:
        error:
          type: string
          description: |
            错误码：
            - `invalid_request`: 请求参数无效
            - `invalid_client`: 客户端认证失败
            - `invalid_grant`: 授权码无效或已过期（Token Exchange 模式下为 JWT 签名验证失败）
            - `server_error`: 服务器内部错误
            - `temporarily_unavailable`: 身份提供方暂时不可用
            - `invalid_redirect_uri`: redirect_uri 格式无效
            - `disallowed_redirect_uri`: redirect_uri 不在允许列表中
        error_description:
          type: string
          description: 人类可读的错误描述
      required: [error]

    OAuth2TokenExchangeRequest:
      type: object
      description: OAuth2 授权码交换请求（Authorization Code 模式）
      properties:
        grant_type:
          type: string
          description: 固定为 "authorization_code"（可省略，默认值）
          enum: [authorization_code]
          default: authorization_code
        code:
          type: string
          description: OAuth2 授权码
        redirect_uri:
          type: string
          description: 必须与授权请求中的 redirect_uri 完全一致
        state:
          type: string
          description: CSRF 防护 state
        device_id:
          type: string
          description: 前端生成的设备 UUID
        device_name:
          type: string
          description: 设备显示名称（如 "Chrome on Mac"）
        user_agent:
          type: string
          description: 客户端 User-Agent
        code_verifier:
          type: string
          description: PKCE code_verifier (RFC 7636)
      required: [code, redirect_uri, state, device_id]

    OAuth2TokenExchangeRFC8693Request:
      type: object
      description: RFC 8693 Token Exchange 请求，将外部 JWT 换取主服务器 access_token
      properties:
        grant_type:
          type: string
          enum: ['urn:ietf:params:oauth:grant-type:token-exchange']
        subject_token:
          type: string
          description: 外部 JWT
        subject_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:access_token']
        device_id:
          type: string
          description: 客户端设备 UUID
      required: [grant_type, subject_token, subject_token_type, device_id]

    OAuth2TokenExchangeResponse:
      type: object
      description: OAuth2 授权码交换成功响应
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: refresh token
        expires_in:
          type: integer
          format: int64
          description: access token 过期时间（秒），通常 3600
        user_id:
          type: string
          description: 已认证用户的唯一 ID
      required: [access_token, refresh_token, expires_in, user_id]

    OAuth2TokenExchangeRFC8693Response:
      type: object
      description: RFC 8693 Token Exchange 成功响应
      properties:
        access_token:
          type: string
        issued_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:access_token']
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
      required: [access_token, issued_token_type, token_type, expires_in]

    OAuth2TokenRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    OAuth2TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
      required: [access_token, expires_in]

    # ========== Main Server: Interrupt ==========

    InterruptAnswerRequest:
      type: object
      properties:
        answer:
          type: string
          maxLength: 10000
          description: 中断答案内容（不能为空，最长 10000 字符）
      required: [answer]

    InterruptAnswerResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
          description: 固定为 "accepted"，表示答案已接受
      required: [status]

    # ========== Main Server: Memory ==========

    ExportMemoriesRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [session, user, global]
          description: 导出范围
        scope_id:
          type: string
          description: 范围 ID（session 或 user 的 UUID，global 时可为空）
        format:
          type: string
          enum: [okf-bundle]
          description: 导出格式
        types:
          type: array
          items:
            type: string
          description: 按类型过滤
        tags:
          type: array
          items:
            type: string
          description: 按标签过滤
        include_log:
          type: boolean
          default: false
          description: 是否生成 log.md
      required: [scope, format]

    # ========== Main Server: STS ==========

    TemporaryCredentialsResponse:
      type: object
      properties:
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [access_key_id, secret_access_key, session_token, expires_at]

    PresignedURLRequest:
      type: object
      properties:
        operation:
          type: string
          enum: [put, get]
          description: 操作类型（put=上传，get=下载）
        key:
          type: string
          description: 对象键（如 "user-123/file-id"）
        expires_in:
          type: integer
          format: int64
          default: 3600
          maximum: 604800
          description: 有效期（秒），默认 3600，最大 604800（7天）
      required: [operation, key]

    PresignedURLResponse:
      type: object
      properties:
        url:
          type: string
          description: 预签名 URL
        expires_at:
          type: string
          format: date-time
          description: 过期时间
      required: [url, expires_at]

    # ========== Main Server: Error ==========

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误码
        message:
          type: string
          description: 错误描述
      required: [error, message]

    # ========== Admin Server: Auth ==========

    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [email, password]

    AdminLoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
            token_type:
              type: string
              enum: [Bearer]
            user:
              $ref: '#/components/schemas/AdminUserResponse'
          required: [access_token, refresh_token, expires_in, token_type, user]
      required: [success, data]

    AdminRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    AdminRefreshSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
            token_type:
              type: string
              enum: [Bearer]
          required: [access_token, refresh_token, expires_in, token_type]
      required: [success, data]

    AdminGetCurrentUserSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AdminUserResponse'
      required: [success, data]

    AdminLogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    AdminLogoutSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            status:
              type: string
              enum: [ok]
          required: [status]
      required: [success, data]

    AdminUserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleInfoResponse'
          description: 用户角色列表（权限系统启用时有值）
      required: [id, email]

    RoleInfoResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
      required: [name]

    JWKSResponse:
      type: object
      description: JWK Set (RFC 7517)
      properties:
        keys:
          type: array
          items:
            type: object
            description: JWK 公钥
            additionalProperties: true
      required: [keys]

    AdminHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        timestamp:
          type: string
          format: date-time
      required: [status]

    AdminErrorResponse:
      type: object
      description: Admin-server 统一错误响应格式（Ant Design Pro 约定）。HTTP 状态码始终为 200。
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          description: |
            错误码：
            - `invalid_request`: 参数校验失败
            - `invalid_credentials`: 邮箱或密码错误
            - `invalid_grant`: refresh_token 无效/已撤销/已过期
            - `unauthorized`: JWT 认证失败
            - `user_not_found`: 用户不存在
            - `role_not_found`: 角色不存在
            - `role_disabled`: 角色已禁用
            - `permission_exists`: 权限策略已存在
            - `admin_user_not_found`: 管理员不存在
            - `validation_error`: 请求参数格式错误
            - `server_error`: 服务器内部错误
        errorMessage:
          type: string
      required: [success, errorCode, errorMessage]

    # ========== Admin Server: Roles ==========

    AdminCreateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: 角色名称（小写字母开头，ASCII 字符）
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
      required: [name, display_name]

    AdminUpdateRoleRequest:
      type: object
      description: 部分更新，所有字段可选
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
        is_enabled:
          type: boolean

    RoleResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
          description: 是否为系统内置角色（不可删除）
        is_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, name, display_name, is_system, is_enabled, created_at]

    AdminListRolesResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RoleResponse'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
          required: [items, total, page, page_size]
      required: [success, data]

    PolicyItemResponse:
      type: object
      properties:
        resource:
          type: string
          description: 资源标识（如 admin-users, roles, permissions）
        action:
          type: string
          description: 操作（如 read, write, delete, *）
      required: [resource, action]

    # ========== Admin Server: Permissions ==========

    AdminCreatePermissionRequest:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
        resource:
          type: string
          minLength: 1
          maxLength: 100
        action:
          type: string
          minLength: 1
          maxLength: 100
      required: [role_id, resource, action]

    AdminDeletePermissionRequest:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
        resource:
          type: string
        action:
          type: string
      required: [role_id, resource, action]

    AdminCheckPermissionRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        resource:
          type: string
        action:
          type: string
      required: [user_id, resource, action]

    AdminListPermissionsResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PolicyResponse'
            total:
              type: integer
          required: [items, total]
      required: [success, data]

    PolicyResponse:
      type: object
      properties:
        role_id:
          type: string
        resource:
          type: string
        action:
          type: string
      required: [role_id, resource, action]

    # ========== Admin Server: User Roles ==========

    AdminAssignRolesRequest:
      type: object
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required: [role_ids]

    UserRoleResponse:
      type: object
      properties:
        user_id:
          type: string
        role_id:
          type: string
        role_name:
          type: string
        assigned_at:
          type: string
          format: date-time
      required: [user_id, role_id, role_name, assigned_at]

    # ========== Admin Server: Users ==========

    AdminListUsersResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserDetailResponse'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
          required: [items, total, page, page_size]
      required: [success, data]

    AdminUserDetailResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, email, created_at, updated_at]

    # ========== Admin Server: Audit Logs ==========

    AdminListAuditLogsResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogResponse'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
          required: [items, total, page, page_size]
      required: [success, data]

    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
        operator_id:
          type: string
        operator_ip:
          type: string
        event_type:
          type: string
          description: 事件类型（如 create, update, delete, assign_role）
        resource_type:
          type: string
          description: 资源类型（如 role, permission, admin_user）
        resource_id:
          type: string
        details:
          description: 事件详情（结构因 event_type 而异）
        created_at:
          type: string
          format: date-time
      required: [id, operator_id, event_type, resource_type, created_at]
